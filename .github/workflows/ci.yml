name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --no-fail-fast
      # nextest does not run doc tests; the README example is one.
      - run: cargo test --doc --all-features

  # q2 compiles this crate with its pinned nightly (rust-toolchain.toml in
  # quarto-dev/q2), so a stable-only crate could break there.
  nightly:
    name: q2 pinned nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-28
          components: clippy
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features --no-fail-fast

  msrv:
    name: rust-version (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - run: cargo check --all-targets --all-features

  # Real-TeX tests against TinyTeX (plan 5.4b). Linux and macOS only: R's
  # install script is a shell script, so Windows runs the mocked tests of the
  # `test` job above. TINYTEX_RS_REQUIRE_TEX=1 makes a missing or broken
  # install fail the real-TeX tests instead of skipping them, and enables
  # the `auto_install_` tests, which install packages (nextest runs them alone:
  # `threads-required = "num-cpus"` in .config/nextest.toml).
  tinytex:
    name: TinyTeX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TINYTEX_RS_REQUIRE_TEX: "1"
      # The release of rstudio/tinytex-releases that R's install script
      # downloads (the script wants the version without the `v`), and the
      # installer bundle. The version tracks q2's pin (TINYTEX_VERSION in
      # quarto-dev/q2 .github/workflows/test-suite.yml, plan 6.1). The install
      # method does not: this job installs the prebuilt `TinyTeX-1` bundle with
      # R's script and adds the packages in .github/tinytex-packages.txt, while
      # q2 installs `TinyTeX-0` plus its own package list.
      TINYTEX_VERSION: "2026.11"
      TINYTEX_INSTALLER: "TinyTeX-1"
      # R's install script at the commit the crate follows (`7818777` of
      # rstudio/tinytex, the structural baseline of design section 3).
      TINYTEX_SCRIPT_SHA: "7818777360b28910ccc6b77c1395fd2a39e3e31c"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest

      # Restored on every run, saved only right after a fresh install and
      # before any test: the auto-install tests change the tree and must never
      # mutate what the cache stores. The key covers the pin, the installer
      # script, and the hashes of the package list and of the two scripts that
      # build the tree.
      - name: Restore TinyTeX cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.TinyTeX
            ~/Library/TinyTeX
          key: tinytex-${{ runner.os }}-${{ runner.arch }}-${{ env.TINYTEX_VERSION }}-${{ env.TINYTEX_INSTALLER }}-${{ env.TINYTEX_SCRIPT_SHA }}-${{ hashFiles('.github/tinytex-packages.txt', '.github/scripts/tinytex-repository.sh', '.github/scripts/tinytex-install-packages.sh') }}

      - name: Install TinyTeX
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rstudio/tinytex/${TINYTEX_SCRIPT_SHA}/tools/install-bin-unix.sh" -o install-bin-unix.sh
          # The script's first argument is the directory it moves the
          # downloaded installer into, so a bare `--no-path` would run
          # `mv ... --no-path/`. It finds `--no-path` by scanning all its
          # arguments, so pass an empty first one.
          sh install-bin-unix.sh "" --no-path
          if [ "$RUNNER_OS" = "Linux" ]; then root="$HOME/.TinyTeX"; else root="$HOME/Library/TinyTeX"; fi
          export PATH="$(ls -d "$root"/bin/*/ | head -1):$PATH"
          # A TinyTeX of an older TeX Live year cannot use the default
          # repository (tlmgr refuses a newer one), so point it at the frozen
          # archive for its year. This runner is disposable, so changing the
          # saved repository is fine here.
          repo=$(sh .github/scripts/tinytex-repository.sh)
          if [ -n "$repo" ]; then tlmgr option repository "$repo"; fi
          # The bundle's saved repository can serve a newer tlmgr than the
          # one in the bundle, and tlmgr then refuses every install with
          # "tlmgr itself needs to be updated". Update it first, after the
          # repository choice above (a frozen repository must be set first).
          tlmgr update --self
          # The real-TeX tests need these tools; TinyTeX-1 may not ship them
          # all. The script checks that every one landed (a corrupt download
          # exits 0) and fails the job otherwise, before the cache is saved.
          sh .github/scripts/tinytex-install-packages.sh .github/tinytex-packages.txt
          du -sh "$root"

      - name: Put TinyTeX on PATH and smoke-check it
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then root="$HOME/.TinyTeX"; else root="$HOME/Library/TinyTeX"; fi
          bindir=$(ls -d "$root"/bin/*/ | head -1)
          echo "$bindir" >> "$GITHUB_PATH"
          export PATH="$bindir:$PATH"
          for tool in pdflatex xelatex lualatex bibtex latexmk tlmgr; do
            "$tool" --version >/dev/null || { echo "::error::$tool --version failed"; exit 1; }
          done
          command -v makeindex >/dev/null || { echo "::error::makeindex missing"; exit 1; }

      - name: Save TinyTeX cache (fresh install only)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.TinyTeX
            ~/Library/TinyTeX
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The tests that install or remove packages (`auto_install_`, and the
      # repository calls of the conformance tests) must never run against the
      # tree the cache stores, so they run against a copy. The cache was saved
      # above, before this step. The copy is a direct child of $RUNNER_TEMP, so
      # it is outside the default install directories, and the gate in
      # tests/integration/sandbox.rs refuses anything else. TINYTEX_DIR and the
      # nonce are exported only after the install steps (the installer script
      # reads TINYTEX_DIR as the parent of `.TinyTeX`, the crate as the root).
      # GITHUB_PATH entries are prepended, so the copy's bin comes first.
      - name: Copy TinyTeX to a disposable tree for the tests that mutate it
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then root="$HOME/.TinyTeX"; else root="$HOME/Library/TinyTeX"; fi
          sh scripts/tex-sandbox.sh create "$root" > "$RUNNER_TEMP/sandbox.env"
          cat "$RUNNER_TEMP/sandbox.env" >> "$GITHUB_ENV"
          copy=$(sed -n 's/^TINYTEX_DIR=//p' "$RUNNER_TEMP/sandbox.env")
          ls -d "$copy"/bin/*/ | head -1 >> "$GITHUB_PATH"
          echo "TINYTEX_RS_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      - run: cargo nextest run --all-features --no-fail-fast

  # ONE-OFF (testing plan, Phase 3): capture a real `tlmgr install` reply from
  # a TinyTeX whose bundled tlmgr is older than the repository's, before
  # `tlmgr update --self`, to replace the doctored-repository fixture
  # `install-tlmgr-outdated`. Remove this job before the pull request merges.
  # No cache on purpose: the capture needs the fresh bundle as it ships.
  capture-tlmgr-outdated:
    name: capture install-tlmgr-outdated (one-off)
    runs-on: ubuntu-latest
    env:
      TINYTEX_SCRIPT_SHA: "7818777360b28910ccc6b77c1395fd2a39e3e31c"
      TINYTEX_VERSION: "2026.11"
      TINYTEX_INSTALLER: "TinyTeX-1"
    steps:
      - uses: actions/checkout@v4
      - name: Install TinyTeX and capture the first install
        shell: bash
        run: |
          set -uo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rstudio/tinytex/${TINYTEX_SCRIPT_SHA}/tools/install-bin-unix.sh" -o install-bin-unix.sh
          out="$RUNNER_TEMP/capture"; mkdir -p "$out"
          # The script's own last `tlmgr` calls (line 138, `postaction`) can
          # fail on this bundle, so keep its status and streams as a capture
          # too, and go on when the tree is there.
          sh install-bin-unix.sh "" --no-path > "$out/installer.stdout" 2> "$out/installer.stderr"
          echo $? > "$out/installer.status"
          cat "$out/installer.status"; tail -20 "$out/installer.stderr"
          test -d "$HOME/.TinyTeX/bin" || { echo "::error::no tree after the installer"; exit 1; }
          export PATH="$(ls -d "$HOME/.TinyTeX"/bin/*/ | head -1):$PATH"
          {
            tlmgr --version
            tlmgr option repository
          } > "$out/context.txt" 2>&1
          # The reply under test: no `update --self` has run.
          LC_ALL=C tlmgr install animate > "$out/install-tlmgr-outdated.stdout" 2> "$out/install-tlmgr-outdated.stderr"
          echo $? > "$out/install-tlmgr-outdated.status"
          # What `update --self --dry-run` says afterwards, for the record.
          LC_ALL=C tlmgr update --self --dry-run > "$out/update-self-dry.stdout" 2> "$out/update-self-dry.stderr" || true
          head -50 "$out"/*
          echo "CAPTURE_DIR=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: install-tlmgr-outdated
          path: ${{ env.CAPTURE_DIR }}
